name: Embedded CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Static Analysis, Unit Tests & STM32 Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain & Quality Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi cppcheck

      - name: Run Static Analysis & Off-Target Unit Tests
        run: ./tools/test_host.sh

      - name: Cross-Compile STM32F303K8 Firmware (Debug & Release)
        run: |
          ./tools/build.sh Debug
          ./tools/build.sh Release

      - name: Upload Firmware Artifacts (.elf, .bin, .hex)
        uses: actions/upload-artifact@v4
        with:
          name: stm32f303-freertos-firmware
          path: |
            build/Debug/*.elf
            build/Debug/*.bin
            build/Release/*.elf
            build/Release/*.bin
